project_id = "financeiro-inteligente"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "financeirointeligente://"
additional_redirect_urls = ["financeirointeligente://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[functions.nfc-e-parser]
verify_jwt = true

[functions.ai-advisor]
verify_jwt = true

[functions.open-finance-sync]
verify_jwt = true
